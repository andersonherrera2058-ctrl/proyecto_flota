<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRODESEG S.A. - Trazabilidad de Envíos</title>
  <style>
    :root {
      --brand-gold: #a87b32;
      --brand-dark: #2a2015;
      --bg-body: #fbf9f5;
      --card-bg: #ffffff;
      --border-color: #e6dfd5;
      --text-main: #2b2520;
      --text-muted: #73695f;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 720px;
      margin: 20px auto;
      background: var(--card-bg);
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(42, 32, 21, 0.08);
      border: 1px solid var(--border-color);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-logo {
      max-width: 260px;
      height: auto;
      margin-bottom: 12px;
    }

    .brand-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--brand-dark);
      margin: 0;
      letter-spacing: 1px;
    }

    .brand-tagline {
      font-size: 0.8rem;
      color: var(--brand-gold);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 6px;
      font-weight: 700;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 14px 18px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--brand-gold);
    }

    button.btn-search {
      padding: 14px 24px;
      background-color: var(--brand-gold);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 700;
      transition: background 0.2s;
    }

    button.btn-search:hover {
      background-color: #8a6125;
    }

    .export-actions {
      display: none;
      gap: 10px;
      margin-bottom: 25px;
      justify-content: flex-end;
    }

    .btn-export {
      padding: 9px 16px;
      font-size: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      border: none;
    }

    .btn-excel { background-color: #198754; color: white; }
    .btn-pdf { background-color: #dc3545; color: white; }

    .timeline {
      position: relative;
      padding-left: 25px;
      border-left: 3px solid var(--border-color);
      margin-top: 20px;
    }

    .timeline-event {
      position: relative;
      margin-bottom: 30px;
    }

    .timeline-event::before {
      content: '';
      position: absolute;
      left: -32px;
      top: 4px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: var(--brand-gold);
      border: 3px solid white;
      box-shadow: 0 0 0 2px var(--brand-gold);
    }

    .badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .badge-success { background-color: #d1e7dd; color: #0f5132; }
    .badge-info { background-color: #f0e6d2; color: #6e501d; }
    .badge-warning { background-color: #fff3cd; color: #664d03; }
    .badge-danger { background-color: #f8d7da; color: #842029; }
    .badge-default { background-color: #e2e3e5; color: #41464b; }

    .location { font-weight: 700; font-size: 1.05rem; color: var(--brand-dark); }
    .notes { color: var(--text-muted); font-size: 0.95rem; margin-top: 4px; }
    .date { font-size: 0.8rem; color: #9c9287; margin-top: 6px; }

    .map-link {
      display: inline-block;
      margin-top: 6px;
      color: var(--brand-gold);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .foto-cumplido {
      margin-top: 12px;
      max-width: 100%;
      max-height: 280px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .alert {
      padding: 15px;
      background-color: #f8d7da;
      color: #842029;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
    }

    .footer-brand {
      text-align: center;
      margin-top: 30px;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      padding-top: 15px;
    }

    @media print {
      body { background-color: white; padding: 0; }
      .container { box-shadow: none; border: none; max-width: 100%; margin: 0; padding: 0; }
      .search-box, .export-actions { display: none !important; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand-header">
      <img src="/logo-prodeseg.png" alt="PRODESEG S.A." class="brand-logo" onerror="this.style.display='none'">
      <h1 class="brand-title">PRODESEG S.A.</h1>
      <div class="brand-tagline">PROTECCIÓN CONTRA INCENDIOS Y SEGURIDAD INDUSTRIAL</div>
    </div>
    
    <div class="search-box">
      <input type="text" id="guiaInput" placeholder="Ingrese número de guía o despacho" value="16581">
      <button class="btn-search" onclick="buscarGuia()">Consultar</button>
    </div>

    <div id="exportBox" class="export-actions">
      <button class="btn-export btn-excel" onclick="exportarExcel()">📊 Descargar Excel (.CSV)</button>
      <button class="btn-export btn-pdf" onclick="window.print()">📄 Guardar Reporte PDF</button>
    </div>

    <div id="resultado"></div>

    <div class="footer-brand">
      🌐 <strong>www.prodeseg.com.co</strong>
    </div>
  </div>

  <script>
    let datosTrazabilidadActuales = [];

    function obtenerClaseBadge(estado) {
      if (!estado) return 'badge-default';
      const est = estado.toUpperCase();
      if (est.includes('ENTREGADO')) return 'badge-success';
      if (est.includes('TRANSITO') || est.includes('REPARTO')) return 'badge-info';
      if (est.includes('DESPACHADO')) return 'badge-warning';
      if (est.includes('NOVEDAD') || est.includes('ERROR')) return 'badge-danger';
      return 'badge-default';
    }

    async function buscarGuia() {
      const guia = document.getElementById('guiaInput').value.trim();
      const resultadoDiv = document.getElementById('resultado');
      const exportBox = document.getElementById('exportBox');

      if (!guia) {
        resultadoDiv.innerHTML = '<div class="alert">Por favor ingrese un número de guía válido.</div>';
        exportBox.style.display = 'none';
        return;
      }

      resultadoDiv.innerHTML = '<p style="text-align:center; color:#73695f;">Consultando trazabilidad PRODESEG S.A...</p>';
      exportBox.style.display = 'none';

      try {
        const response = await fetch(`/api/tracking/${guia}`);
        const result = await response.json();

        if (!response.ok || result.error) {
          resultadoDiv.innerHTML = `<div class="alert">Error: ${result.error || 'No se pudo obtener la información.'}</div>`;
          return;
        }

        const eventos = result.data || [];

        if (eventos.length === 0) {
          resultadoDiv.innerHTML = '<div class="alert">No se encontraron eventos registrados para esta guía.</div>';
          return;
        }

        datosTrazabilidadActuales = eventos;
        exportBox.style.display = 'flex';

        let html = '<div class="timeline">';
        eventos.forEach(evento => {
          const fecha = evento.fecha_reporte ? new Date(evento.fecha_reporte).toLocaleString('es-CO') : 'Sin fecha';
          const badgeClass = obtenerClaseBadge(evento.estado_envio);
          const fotoHtml = evento.foto_url ? `<br><img src="${evento.foto_url}" class="foto-cumplido" alt="Evidencia Fotográfica">` : '';
          const mapHtml = evento.maps_url ? `<br><a href="${evento.maps_url}" target="_blank" class="map-link">🗺️ Ver ubicación en Google Maps</a>` : '';

          html += `
            <div class="timeline-event">
              <span class="badge ${badgeClass}">${evento.estado_envio}</span>
              <div class="location">📍 ${evento.ubicacion}</div>
              ${mapHtml}
              <div class="notes">${evento.notas || ''}</div>
              ${fotoHtml}
              <div class="date">🕒 ${fecha}</div>
            </div>
          `;
        });
        html += '</div>';

        resultadoDiv.innerHTML = html;

      } catch (err) {
        resultadoDiv.innerHTML = `<div class="alert">Error de conexión: ${err.message}</div>`;
      }
    }

    function exportarExcel() {
      if (datosTrazabilidadActuales.length === 0) return;

      const guia = document.getElementById('guiaInput').value.trim();
      let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
      csvContent += "PRODESEG_Guia;Estado;Ubicacion;Notas;Fecha;Google_Maps\n";

      datosTrazabilidadActuales.forEach(e => {
        const fecha = e.fecha_reporte ? new Date(e.fecha_reporte).toLocaleString('es-CO') : '';
        const estado = (e.estado_envio || '').replace(/;/g, ',');
        const ubica = (e.ubicacion || '').replace(/;/g, ',');
        const notas = (e.notas || '').replace(/;/g, ',').replace(/\n/g, ' ');
        const maps = e.maps_url || '';

        csvContent += `"${guia}";"${estado}";"${ubica}";"${notas}";"${fecha}";"${maps}"\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `PRODESEG_Trazabilidad_Guia_${guia}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    window.onload = buscarGuia;
  </script>
</body>
</html>
