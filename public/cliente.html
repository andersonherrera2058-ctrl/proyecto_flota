<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PRODESEG S.A. - Trazabilidad de Envíos</title>
  
  <!-- Configuración App Móvil PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#a87b32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PRODESEG Envíos">

  <!-- Librería para descarga de PDF nativo -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root {
      --brand-gold: #a87b32;
      --brand-dark: #2a2015;
      --bg-body: #fbf9f5;
      --card-bg: #ffffff;
      --border-color: #e6dfd5;
      --text-main: #2b2520;
      --text-muted: #73695f;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      margin: 0;
      padding: 12px;
    }

    .container {
      max-width: 720px;
      width: 100%;
      margin: 15px auto;
      background: var(--card-bg);
      padding: 24px 18px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(42, 32, 21, 0.08);
      border: 1px solid var(--border-color);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .brand-title-link {
      text-decoration: none;
    }

    .brand-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--brand-dark);
      margin: 0;
    }

    .brand-tagline {
      font-size: 0.75rem;
      color: var(--brand-gold);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 6px;
      font-weight: 700;
    }

    .search-box {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      width: 100%;
    }

    input[type="text"] {
      flex: 1 1 200px;
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--brand-gold);
    }

    button.btn-search {
      flex: 0 0 auto;
      width: 100%;
      padding: 12px 20px;
      background-color: var(--brand-gold);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 700;
    }

    @media (min-width: 480px) {
      button.btn-search {
        width: auto;
      }
    }

    button.btn-search:hover {
      background-color: #8a6125;
    }

    .btn-pdf {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background-color: #dc3545;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 2px 6px rgba(220, 53, 69, 0.2);
    }

    .btn-pdf:hover {
      background-color: #bb2d3b;
    }

    .btn-maps-amigable {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      background-color: #2563eb;
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.2);
    }

    .btn-maps-amigable:hover {
      background-color: #1d4ed8;
    }

    .timeline {
      position: relative;
      padding-left: 20px;
      border-left: 3px solid var(--border-color);
      margin-top: 20px;
    }

    .timeline-event {
      position: relative;
      margin-bottom: 25px;
    }

    .timeline-event::before {
      content: '';
      position: absolute;
      left: -27px;
      top: 4px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background-color: var(--brand-gold);
      border: 3px solid white;
      box-shadow: 0 0 0 2px var(--brand-gold);
    }

    .badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .badge-success { background-color: #d1e7dd; color: #0f5132; }
    .badge-info { background-color: #f0e6d2; color: #6e501d; }
    .badge-warning { background-color: #fff3cd; color: #664d03; }
    .badge-danger { background-color: #f8d7da; color: #842029; }

    .location { font-weight: 700; font-size: 1rem; color: var(--brand-dark); word-break: break-word; }
    .notes { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; word-break: break-word; }
    .date { font-size: 0.8rem; color: #9c9287; margin-top: 6px; }
    .foto-cumplido { margin-top: 12px; max-width: 100%; height: auto; max-height: 280px; border-radius: 10px; border: 1px solid var(--border-color); }
    .alert { padding: 12px; background-color: #f8d7da; color: #842029; border-radius: 10px; text-align: center; font-weight: 600; font-size: 0.9rem; }
    .footer-brand { text-align: center; margin-top: 25px; font-size: 0.8rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 15px; }
  </style>
</head>
<body>

  <div class="container" id="reporteContenido">
    <div class="brand-header">
      <a href="/admin.html" class="brand-title-link" title="Acceso Interno">
        <h1 class="brand-title">🔥 PRODESEG S.A.</h1>
      </a>
      <div class="brand-tagline">PROTECCIÓN CONTRA INCENDIOS Y SEGURIDAD INDUSTRIAL</div>
    </div>
    
    <div class="search-box" data-html2canvas-ignore="true">
      <input type="text" id="guiaInput" placeholder="Ej. PRO-001 o 48600">
      <button class="btn-search" onclick="buscarGuia()">Consultar</button>
    </div>

    <div id="resultado"></div>

    <div class="footer-brand">
      🌐 <strong>www.prodeseg.com.co</strong> | Certificado Oficial de Trazabilidad
    </div>
  </div>

  <script>
    let guiaActual = '';

    async function buscarGuia() {
      const guia = document.getElementById('guiaInput').value.trim();
      const resultadoDiv = document.getElementById('resultado');

      if (!guia) {
        resultadoDiv.innerHTML = '<div class="alert">Por favor ingrese un número de guía.</div>';
        return;
      }

      guiaActual = guia;
      resultadoDiv.innerHTML = '<p style="text-align:center; color:#73695f;">Consultando trazabilidad en la red PRODESEG S.A...</p>';

      try {
        const response = await fetch(`/api/tracking/${guia}`);
        
        // Manejo seguro por si el servidor devuelve HTML o respuesta no válida en lugar de JSON
        const contentType = response.headers.get("content-type");
        if (!contentType || !contentType.includes("application/json")) {
          // Si el servidor está despertando de suspensión en Render
          resultadoDiv.innerHTML = '<div class="alert">El servidor se está reactivando. Por favor presiona "Consultar" nuevamente en 10 segundos.</div>';
          return;
        }

        const result = await response.json();
        const eventos = result.data || [];

        if (!response.ok || eventos.length === 0) {
          resultadoDiv.innerHTML = '<div class="alert">No se encontraron eventos registrados para esta guía.</div>';
          return;
        }

        let html = '<div class="timeline">';
        eventos.forEach(evento => {
          const fecha = evento.fecha_reporte ? new Date(evento.fecha_reporte).toLocaleString('es-CO') : 'Sin fecha';
          const est = (evento.estado_envio || '').toUpperCase();
          
          let badgeClass = 'badge-warning';
          if (est.includes('ENTREGADO')) badgeClass = 'badge-success';
          else if (est.includes('RUTA') || est.includes('TRANSITO') || est.includes('REPARTO')) badgeClass = 'badge-info';
          else if (est.includes('NOVEDAD')) badgeClass = 'badge-danger';

          let mapHtml = '';
          if (evento.maps_url) {
            mapHtml = `<br><a href="${evento.maps_url}" target="_blank" class="btn-maps-amigable">📍 Ver Ubicación en Google Maps</a>`;
          }

          const fotoHtml = evento.foto_url ? `<br><img src="${evento.foto_url}" class="foto-cumplido" alt="Evidencia de Cumplido">` : '';

          html += `
            <div class="timeline-event">
              <span class="badge ${badgeClass}">${evento.estado_envio}</span>
              <div class="location">📍 ${evento.ubicacion}</div>
              ${mapHtml}
              <div class="notes">${evento.notas || ''}</div>
              ${fotoHtml}
              <div class="date">🕒 ${fecha}</div>
            </div>
          `;
        });
        html += '</div>';

        // Botón para descarga de PDF
        html += `<button class="btn-pdf" data-html2canvas-ignore="true" onclick="descargarPDF()">📄 Descargar Certificado de Trazabilidad (PDF)</button>`;

        resultadoDiv.innerHTML = html;

      } catch (err) {
        resultadoDiv.innerHTML = `<div class="alert">Servidor iniciando o problema de conexión. Reintente en un momento.</div>`;
      }
    }

    function descargarPDF() {
      const elemento = document.getElementById('reporteContenido');
      const opciones = {
        margin:       8,
        filename:     `Trazabilidad_PRODESEG_${guiaActual}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opciones).from(elemento).save();
    }
  </script>
</body>
</html>
