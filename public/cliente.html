<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRODESEG S.A. - Trazabilidad de Envíos</title>
  
  <!-- Configuración App Móvil PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#a87b32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PRODESEG Envíos">

  <style>
    :root {
      --brand-gold: #a87b32;
      --brand-dark: #2a2015;
      --bg-body: #fbf9f5;
      --card-bg: #ffffff;
      --border-color: #e6dfd5;
      --text-main: #2b2520;
      --text-muted: #73695f;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 720px;
      margin: 30px auto;
      background: var(--card-bg);
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(42, 32, 21, 0.08);
      border: 1px solid var(--border-color);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-title-link {
      text-decoration: none;
    }

    .brand-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--brand-dark);
      margin: 0;
    }

    .brand-tagline {
      font-size: 0.8rem;
      color: var(--brand-gold);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 6px;
      font-weight: 700;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    input[type="text"] {
      flex: 1;
      padding: 14px 18px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--brand-gold);
    }

    button.btn-search {
      padding: 14px 24px;
      background-color: var(--brand-gold);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 700;
    }

    button.btn-search:hover {
      background-color: #8a6125;
    }

    .btn-maps-amigable {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      background-color: #2563eb;
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.2);
    }

    .btn-maps-amigable:hover {
      background-color: #1d4ed8;
    }

    .timeline {
      position: relative;
      padding-left: 25px;
      border-left: 3px solid var(--border-color);
      margin-top: 20px;
    }

    .timeline-event {
      position: relative;
      margin-bottom: 30px;
    }

    .timeline-event::before {
      content: '';
      position: absolute;
      left: -32px;
      top: 4px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: var(--brand-gold);
      border: 3px solid white;
      box-shadow: 0 0 0 2px var(--brand-gold);
    }

    .badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .badge-success { background-color: #d1e7dd; color: #0f5132; }
    .badge-info { background-color: #f0e6d2; color: #6e501d; }
    .badge-warning { background-color: #fff3cd; color: #664d03; }
    .badge-danger { background-color: #f8d7da; color: #842029; }

    .location { font-weight: 700; font-size: 1.05rem; color: var(--brand-dark); }
    .notes { color: var(--text-muted); font-size: 0.95rem; margin-top: 4px; }
    .date { font-size: 0.8rem; color: #9c9287; margin-top: 6px; }
    .foto-cumplido { margin-top: 12px; max-width: 100%; max-height: 280px; border-radius: 10px; border: 1px solid var(--border-color); }
    .alert { padding: 15px; background-color: #f8d7da; color: #842029; border-radius: 10px; text-align: center; font-weight: 600; }
    .footer-brand { text-align: center; margin-top: 30px; font-size: 0.85rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 15px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand-header">
      <a href="/admin.html" class="brand-title-link" title="Acceso Interno">
        <h1 class="brand-title">🔥 PRODESEG S.A.</h1>
      </a>
      <div class="brand-tagline">PROTECCIÓN CONTRA INCENDIOS Y SEGURIDAD INDUSTRIAL</div>
    </div>
    
    <div class="search-box">
      <input type="text" id="guiaInput" placeholder="Ej. PRO-001">
      <button class="btn-search" onclick="buscarGuia()">Consultar</button>
    </div>

    <div id="resultado"></div>

    <div class="footer-brand">
      🌐 <strong>www.prodeseg.com.co</strong> | Consultas de Trazabilidad
    </div>
  </div>

  <script>
    async function buscarGuia() {
      const guia = document.getElementById('guiaInput').value.trim();
      const resultadoDiv = document.getElementById('resultado');

      if (!guia) {
        resultadoDiv.innerHTML = '<div class="alert">Por favor ingrese un número de guía.</div>';
        return;
      }

      resultadoDiv.innerHTML = '<p style="text-align:center; color:#73695f;">Consultando trazabilidad en la red PRODESEG S.A...</p>';

      try {
        const response = await fetch(`/api/tracking/${guia}`);
        const result = await response.json();
        const eventos = result.data || [];

        if (eventos.length === 0) {
          resultadoDiv.innerHTML = '<div class="alert">No se encontraron eventos registrados para esta guía.</div>';
          return;
        }

        let html = '<div class="timeline">';
        eventos.forEach(evento => {
          const fecha = evento.fecha_reporte ? new Date(evento.fecha_reporte).toLocaleString('es-CO') : 'Sin fecha';
          const est = (evento.estado_envio || '').toUpperCase();
          
          let badgeClass = 'badge-warning';
          if (est.includes('ENTREGADO')) badgeClass = 'badge-success';
          else if (est.includes('RUTA') || est.includes('TRANSITO') || est.includes('REPARTO')) badgeClass = 'badge-info';
          else if (est.includes('NOVEDAD')) badgeClass = 'badge-danger';

          let mapHtml = '';
          if (evento.maps_url) {
            mapHtml = `<br><a href="${evento.maps_url}" target="_blank" class="btn-maps-amigable">📍 Ver Ubicación en Google Maps</a>`;
          }

          const fotoHtml = evento.foto_url ? `<br><img src="${evento.foto_url}" class="foto-cumplido" alt="Evidencia de Cumplido">` : '';

          html += `
            <div class="timeline-event">
              <span class="badge ${badgeClass}">${evento.estado_envio}</span>
              <div class="location">📍 ${evento.ubicacion}</div>
              ${mapHtml}
              <div class="notes">${evento.notas || ''}</div>
              ${fotoHtml}
              <div class="date">🕒 ${fecha}</div>
            </div>
          `;
        });
        html += '</div>';

        resultadoDiv.innerHTML = html;

      } catch (err) {
        resultadoDiv.innerHTML = `<div class="alert">Error de conexión: ${err.message}</div>`;
      }
    }
  </script>
</body>
</html>
