<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POLARIS INC - Campo & Operaciones</title>
  <style>
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: #030712;
      color: #f8fafc;
      margin: 0;
      padding: 15px;
      min-height: 100vh;
      background-image: radial-gradient(circle at 50% 10%, #1e1b4b 0%, #030712 70%);
    }

    .card {
      max-width: 500px;
      margin: 10px auto;
      background: #0b1329;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.1);
      border: 1px solid #1e293b;
    }

    .brand-title {
      text-align: center;
      font-size: 1.8rem;
      font-weight: 900;
      color: #ffffff;
      margin: 0;
      letter-spacing: 2px;
    }

    .brand-title span { color: #38bdf8; font-size: 1rem; }

    .brand-sub {
      text-align: center;
      font-size: 0.75rem;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 25px;
      font-weight: 600;
    }

    .form-group { margin-bottom: 18px; }
    label { font-weight: 700; display: block; margin-bottom: 6px; font-size: 0.85rem; color: #cbd5e1; }
    
    input, select, textarea {
      width: 100%;
      padding: 12px;
      background-color: #030712;
      border: 1px solid #1e293b;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 1rem;
      color: white;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #38bdf8;
    }

    .input-gps-group { display: flex; gap: 8px; }

    .btn-gps {
      width: auto;
      background-color: #38bdf8;
      color: #030712;
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #030712;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 800;
      letter-spacing: 1px;
      margin-top: 10px;
    }

    .alert { margin-top: 15px; padding: 12px; border-radius: 10px; text-align: center; font-weight: 700; }
    .alert-success { background-color: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
    .alert-danger { background-color: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    #previewImg { width: 100%; max-height: 250px; object-fit: cover; border-radius: 10px; margin-top: 10px; display: none; border: 1px solid #1e293b; }
  </style>
</head>
<body>

  <div class="card">
    <div style="text-align:center; color:#38bdf8; font-size:1.8rem;">✦</div>
    <h1 class="brand-title">POLARIS <span>INC</span></h1>
    <div class="brand-sub">Sistemas Automatizados | Campo</div>

    <form id="adminForm">
      <div class="form-group">
        <label>NÚMERO DE GUÍA / CÓDIGO:</label>
        <input type="text" id="guia" placeholder="Ej. 16581 o PDS-2026-001" required>
      </div>

      <div class="form-group">
        <label>ESTADO OPERATIVO:</label>
        <select id="estado" required>
          <option value="DESPACHADO">DESPACHADO</option>
          <option value="EN_TRANSITO">EN TRÁNSITO</option>
          <option value="EN_REPARTO">EN REPARTO</option>
          <option value="ENTREGADO">ENTREGADO (CUMPLIDO)</option>
          <option value="NOVEDAD">NOVEDAD / RETRASO</option>
        </select>
      </div>

      <div class="form-group">
        <label>UBICACIÓN ACTUAL:</label>
        <div class="input-gps-group">
          <input type="text" id="ubicacion" placeholder="Ej. Municipio / Bodega / Punto de control" required>
          <button type="button" class="btn-gps" onclick="capturarGPS()">📍 GPS</button>
        </div>
      </div>

      <div class="form-group">
        <label>NOTAS / NOVEDADES:</label>
        <textarea id="notas" rows="3" placeholder="Detalles de la entrega o novedad..."></textarea>
      </div>

      <div class="form-group">
        <label>📸 EVIDENCIA / CUMPLIDO:</label>
        <input type="file" id="fotoInput" accept="image/*" capture="environment" onchange="mostrarVistaPrevia()">
        <img id="previewImg" alt="Vista previa de la evidencia">
      </div>

      <button type="submit">REGISTRAR EVENTO</button>
    </form>

    <div id="mensaje"></div>
  </div>

  <script>
    let fotoBase64 = null;
    let enlaceGoogleMaps = null;

    function capturarGPS() {
      const ubicacionInput = document.getElementById('ubicacion');
      if (navigator.geolocation) {
        ubicacionInput.value = "Obteniendo coordenadas...";
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            ubicacionInput.value = `GPS (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
            enlaceGoogleMaps = `https://www.google.com/maps?q=${lat},${lng}`;
          },
          (error) => {
            alert("Acceso GPS denegado o no disponible.");
            ubicacionInput.value = "";
          },
          { enableHighAccuracy: true }
        );
      } else {
        alert("Navegador no compatible con geolocalización.");
      }
    }

    function mostrarVistaPrevia() {
      const file = document.getElementById('fotoInput').files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          fotoBase64 = e.target.result;
          const img = document.getElementById('previewImg');
          img.src = fotoBase64;
          img.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    }

    document.getElementById('adminForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const mensajeDiv = document.getElementById('mensaje');
      mensajeDiv.innerHTML = '<p style="text-align:center; color:#94a3b8;">Sincronizando evento...</p>';

      const payload = {
        numero_guia: document.getElementById('guia').value,
        estado_envio: document.getElementById('estado').value,
        ubicacion: document.getElementById('ubicacion').value,
        notas: document.getElementById('notas').value,
        foto_url: fotoBase64,
        maps_url: enlaceGoogleMaps
      };

      try {
        const res = await fetch('/api/tracking', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await res.json();

        if (res.ok && result.success) {
          mensajeDiv.innerHTML = '<div class="alert alert-success">✅ Registro procesado con éxito.</div>';
          document.getElementById('adminForm').reset();
          document.getElementById('previewImg').style.display = 'none';
          fotoBase64 = null;
          enlaceGoogleMaps = null;
        } else {
          mensajeDiv.innerHTML = `<div class="alert alert-danger">❌ Error: ${result.error}</div>`;
        }
      } catch (err) {
        mensajeDiv.innerHTML = `<div class="alert alert-danger">❌ Error de conexión: ${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
