<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRODESEG S.A. - Gestión y Registro Operativo</title>
  <style>
    :root {
      --brand-gold: #a87b32;
      --brand-dark: #2a2015;
      --bg-body: #fbf9f5;
      --card-bg: #ffffff;
      --border-color: #e6dfd5;
      --text-main: #2b2520;
      --text-muted: #73695f;
    }

    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-body); margin: 0; padding: 15px; }
    .card { max-width: 520px; margin: 10px auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); border: 1px solid var(--border-color); }
    .brand-title { text-align: center; color: var(--brand-gold); margin-top: 0; margin-bottom: 4px; font-size: 1.6rem; font-weight: 800; }
    .brand-sub { text-align: center; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 20px; font-weight: 700; letter-spacing: 1px; }
    
    .toolbar-admin {
      background-color: #f1ece4;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
      border: 1px solid var(--border-color);
    }

    .btn-excel-global {
      background-color: #198754;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      width: 100%;
    }
    .btn-excel-global:hover { background-color: #146c43; }

    .form-group { margin-bottom: 18px; }
    label { font-weight: 700; display: block; margin-bottom: 6px; font-size: 0.95rem; color: var(--text-main); }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 1rem; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--brand-gold); }
    
    .input-gps-group { display: flex; gap: 8px; }
    .btn-gps { width: auto; background-color: var(--brand-gold); color: white; border: none; padding: 10px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .btn-gps:hover { background-color: #8a6125; }

    button[type="submit"] { width: 100%; padding: 14px; background-color: #198754; color: white; border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer; font-weight: bold; margin-top: 10px; }
    button[type="submit"]:hover { background-color: #146c43; }
    .alert { margin-top: 15px; padding: 12px; border-radius: 8px; text-align: center; font-weight: 600; }
    .alert-success { background-color: #d1e7dd; color: #0f5132; }
    .alert-danger { background-color: #f8d7da; color: #842029; }
    #previewImg { width: 100%; max-height: 280px; object-fit: cover; border-radius: 8px; margin-top: 10px; display: none; border: 1px solid #ddd; }
    .status-text { font-size: 0.8rem; color: #6c757d; margin-top: 4px; display: block; }
  </style>
</head>
<body>

  <div class="card">
    <h2 class="brand-title">🔥 PRODESEG S.A.</h2>
    <div class="brand-sub">Panel de Control & Registro Operativo</div>

    <!-- Módulo de Exportación General Interna -->
    <div class="toolbar-admin">
      <button class="btn-excel-global" onclick="exportarConsolidadoGeneral()">📊 Descargar Reporte General Excel (.CSV)</button>
    </div>

    <form id="adminForm">
      <div class="form-group">
        <label>Número de Guía / Despacho:</label>
        <input type="text" id="guia" placeholder="Ingresa número de guía (ej. PRO-001)" required>
      </div>

      <div class="form-group">
        <label>Estado del Envío:</label>
        <select id="estado" required>
          <option value="EN_BODEGA">EN BODEGA (PENDIENTE CEDI / CITA / FRECUENCIA)</option>
          <option value="DESPACHADO">DESPACHADO</option>
          <option value="EN_TRANSITO">EN TRÁNSITO</option>
          <option value="EN_REPARTO">EN REPARTO</option>
          <option value="ENTREGADO">ENTREGADO (CUMPLIDO)</option>
          <option value="NOVEDAD">NOVEDAD / RETRASO</option>
        </select>
      </div>

      <div class="form-group">
        <label>Ubicación Actual:</label>
        <div class="input-gps-group">
          <input type="text" id="ubicacion" placeholder="Ej. Bogotá D.C. / Bodega Principal" required>
          <button type="button" class="btn-gps" onclick="capturarGPS()">📍 GPS</button>
        </div>
      </div>

      <div class="form-group">
        <label>Notas u Observaciones:</label>
        <textarea id="notas" rows="3" placeholder="Detalles de entrega, nombre de quien recibe o novedades..."></textarea>
      </div>

      <div class="form-group">
        <label>📸 Foto HD del Cumplido / Remisión:</label>
        <input type="file" id="fotoInput" accept="image/*" capture="environment" onchange="procesarFotoOptimizada()">
        <span id="fotoEstado" class="status-text">Captura directa desde la cámara.</span>
        <img id="previewImg" alt="Vista previa optimizada">
      </div>

      <button type="submit">Guardar Registro Protegido</button>
    </form>

    <div id="mensaje"></div>
  </div>

  <script>
    const API_KEY = "PRODESEG_LIVE_2026";
    let fotoBase64 = null;
    let enlaceGoogleMaps = null;

    function capturarGPS() {
      const ubicacionInput = document.getElementById('ubicacion');
      if (navigator.geolocation) {
        ubicacionInput.value = "Obteniendo ubicación GPS...";
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            ubicacionInput.value = `Ubicación GPS (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
            enlaceGoogleMaps = `https://www.google.com/maps?q=${lat},${lng}`;
          },
          (error) => {
            alert("No se pudo obtener el GPS.");
            ubicacionInput.value = "";
          },
          { enableHighAccuracy: true }
        );
      } else {
        alert("Tu dispositivo no soporta geolocalización.");
      }
    }

    function procesarFotoOptimizada() {
      const file = document.getElementById('fotoInput').files[0];
      const estadoSpan = document.getElementById('fotoEstado');
      if (!file) return;

      estadoSpan.innerText = "Optimizando resolución HD...";

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.src = e.target.result;

        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 1400;
          const MAX_HEIGHT = 1400;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
          } else {
            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
          }

          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          fotoBase64 = canvas.toDataURL('image/jpeg', 0.85);

          const preview = document.getElementById('previewImg');
          preview.src = fotoBase64;
          preview.style.display = 'block';

          estadoSpan.innerText = "✅ Imagen HD optimizada.";
        };
      };
      reader.readAsDataURL(file);
    }

    document.getElementById('adminForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const mensajeDiv = document.getElementById('mensaje');
      mensajeDiv.innerHTML = '<p style="text-align:center;">Validando credenciales y guardando...</p>';

      const payload = {
        api_key: API_KEY,
        numero_guia: document.getElementById('guia').value,
        estado_envio: document.getElementById('estado').value,
        ubicacion: document.getElementById('ubicacion').value,
        notas: document.getElementById('notas').value,
        foto_url: fotoBase64,
        maps_url: enlaceGoogleMaps
      };

      try {
        const res = await fetch('/api/tracking', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (res.ok && data.success) {
          mensajeDiv.innerHTML = '<div class="alert alert-success">✅ Registro guardado exitosamente.</div>';
          document.getElementById('adminForm').reset();
          document.getElementById('previewImg').style.display = 'none';
          document.getElementById('fotoEstado').innerText = "Captura directa desde la cámara.";
          fotoBase64 = null;
          enlaceGoogleMaps = null;
        } else {
          mensajeDiv.innerHTML = `<div class="alert alert-danger">❌ Error: ${data.error}</div>`;
        }
      } catch (err) {
        mensajeDiv.innerHTML = `<div class="alert alert-danger">❌ Error de conexión: ${err.message}</div>`;
      }
    });

    async function exportarConsolidadoGeneral() {
      try {
        const res = await fetch('/api/reports/general');
        const result = await res.json();

        if (!res.ok || result.error || !result.data || result.data.length === 0) {
          alert('No hay registros disponibles para exportar.');
          return;
        }

        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        csvContent += "Guia;Estado;Ubicacion;Notas;Fecha;Google_Maps;Tiene_Cumplido\n";

        result.data.forEach(f => {
          const guia = (f.guia || '').replace(/;/g, ',');
          const estado = (f.estado_envio || '').replace(/;/g, ',');
          const ubica = (f.ubicacion || '').replace(/;/g, ',');
          const notas = (f.notas || '').replace(/;/g, ',').replace(/\n/g, ' ');
          const fecha = f.fecha_reporte ? new Date(f.fecha_reporte).toLocaleString('es-CO') : '';
          const maps = f.maps_url || '';
          const tieneFoto = f.tiene_evidencia || 'NO';

          csvContent += `"${guia}";"${estado}";"${ubica}";"${notas}";"${fecha}";"${maps}";"${tieneFoto}"\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `PRODESEG_Consolidado_General.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (err) {
        alert('Error descargando el reporte: ' + err.message);
      }
    }
  </script>
</body>
</html>
